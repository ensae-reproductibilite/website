# Données des boîtes de checkpoint, lues par _extensions/checkpoint/checkpoint.lua.
#
# Une entrée par étape, indexée par le nom utilisé dans {{< checkpoint appliN >}}.
# - gitops: true ajoute au bloc de commandes du checkpoint la même commande, à relancer
#   dans le clone du dépôt application-deployment (étapes avec un dépôt GitOps, à partir
#   de l'application 22a). Le script détecte le dépôt à partir de `origin`.
# - todo: la liste cumulative de ce que l'élève doit avoir mis en place de son côté
#   (comptes, secrets, services à lancer, réglages à cliquer) pour arriver à l'étape
#   sans passer par les étapes précédentes. Ces éléments ne peuvent pas être dans le dépôt.
#   Chaque élément est un texte court en Markdown, en français (fr) et en anglais (en).
#
# Les étapes sans rien à faire (ici les étapes 1 et 2) peuvent être omises.

