      fr: "Classification du niveau d'obésité (7 classes) à partir d'habitudes alimentaires et d'activité physique. Un modèle LightGBM est exposé par une API FastAPI déployée sur Kubernetes, avec suivi par Prometheus et Grafana."
      en: "Classification of obesity level (7 classes) from eating habits and physical activity. A LightGBM model is served by a FastAPI API deployed on Kubernetes, monitored with Prometheus and Grafana."
  - repo: sarakpyny/MLOps-nlp-manifesto
    title: "Party Influence in French Electoral Manifestos"
    parcours: "MLOps"
    stack: [FastAPI, MLflow, Docker, Kubernetes, ArgoCD]
    website: https://sarakpyny.github.io/MLOps-nlp-manifesto/
    description:
      fr: "Pipeline MLOps d'un modèle de topic modeling (LDA) sur les programmes électoraux français, exposé par une API FastAPI déployée sur Kubernetes, pour étudier l'influence des partis et des profils des candidats."
