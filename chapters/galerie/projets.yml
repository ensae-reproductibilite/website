      fr: "Modèles LightGBM réglés avec Optuna pour prédire les contrats de marchés binaires Kalshi (série KXCPI), avec backtest walk-forward et API FastAPI publiant les prédictions et le PnL quotidien."
      en: "LightGBM models tuned with Optuna to predict Kalshi binary contracts (KXCPI series), with walk-forward backtesting and a FastAPI API that publishes predictions and daily PnL."
  - repo: edequercize/applied_statistics
