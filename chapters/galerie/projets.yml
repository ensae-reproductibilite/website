      en: "MLOps pipeline that estimates forest fire risk from weather variables: model comparison tracked in MLflow, a FastAPI API, a Streamlit dashboard and Kubernetes deployment."
  - repo: xdalp/serge3A
    title: "Serge"
    parcours: "Dashboard / app"
    stack: [Streamlit, FastAPI, Docker, ArgoCD]
    website: https://serge3a-tpradeau.lab.sspcloud.fr
