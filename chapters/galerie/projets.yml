      fr: "Compare un CV à une offre d'emploi en anglais : similarité sémantique par embeddings de LLM et extraction des compétences par reconnaissance d'entités nommées (NER), avec les compétences présentes et manquantes."
      en: "Compares a resume with a job offer, in English: semantic similarity from LLM embeddings and skill extraction by named entity recognition (NER), listing the skills present and missing."
  - repo: maximechansat/Snake_RL
    title: "Snake RL"
    parcours: "Dashboard / app"
    stack: [Gymnasium, Streamlit, Docker, pytest, GitHub Actions]
    website: https://snake-rl-maximechansat.lab.sspcloud.fr
    description:
      fr: "Apprentissage par renforcement (Q-learning) appliqué au jeu Snake, avec un tableau de bord Streamlit pour comparer les configurations d'entraînement et visualiser les parties."
      en: "Q-learning reinforcement learning applied to the Snake game, with a Streamlit dashboard to compare training configurations and visualise games."
  - repo: lecoqm/Stress_eleves
    title: "Stress des élèves dans le supérieur"
    parcours: "Publication"
    stack: [Python, Quarto, Docker, uv]
    website: https://lecoqm.github.io/Stress_eleves/
    description:
      fr: "Comparaison de plusieurs modèles de classification (régressions logistiques, Lasso, forêts aléatoires, boosting) pour prédire le niveau de stress d'étudiants du supérieur à partir d'une enquête anonymisée. Résultats publiés en site Quarto."
      en: "Comparison of several classification models (logistic regressions, Lasso, random forests, boosting) to predict students' stress level in higher education from an anonymised survey. Results published as a Quarto website."
  - repo: victorgalmiche/umap-clustering-mise-en-prod
