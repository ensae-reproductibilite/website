2024:
  - repo: AhmedProj/PrimePredict
    title: "PrimePredict"
    parcours: "MLOps"
    website: https://danalejosolerma.github.io/page_prime_predict
    description:
      fr: "Avec PrimePredict, il est possible de calculer les primes annuelles d’assurance matérielle à partir de données fournies. Le modèle prédit à la fois le coût des dommages matériels et la fréquence des incidents matériels."
