# Galerie des projets étudiants. Une entrée par dépôt, regroupées par année.
# Champs : repo (owner/name, obligatoire), title, parcours (MLOps | Dashboard / app | Big data | Publication),
# stack (liste), description.fr, description.en, website (optionnel).
2026:
  - repo: avnerelbaz3500/A_Global_Affordability_Overview_2017_2024
    title: "A Global Affordability Overview 2017-2024"
    parcours: "Dashboard / app"
    stack: [Streamlit, Docker, Kubernetes, ArgoCD]
    website: https://food-affordability-django75.lab.sspcloud.fr/
    description:
      fr: "Tableau de bord Streamlit sur le coût d'une alimentation saine dans le monde de 2017 à 2024, à partir de données de la Banque mondiale. Permet de comparer pays et régions et de filtrer par année."
      en: "Streamlit dashboard on the cost of a healthy diet across countries from 2017 to 2024, based on World Bank data. It compares countries and regions and filters by year."
  - repo: audricms/R-FPOP-Change-Points-Detection
    title: "Changepoint Detection in the Presence of Outliers"
    parcours: "Dashboard / app"
    stack: [Streamlit, Docker, Kubernetes, ArgoCD, GitHub Actions]
    website: https://rfpop-vgraillat.user.lab.sspcloud.fr
    description:
      fr: "Implémentation de l'algorithme R-FPOP de détection de ruptures dans les séries temporelles en présence de valeurs aberrantes, avec une application Streamlit pour tester ses paramètres et fonctions de perte."
      en: "Implementation of the R-FPOP algorithm for detecting change points in time series with outliers, with a Streamlit app to test its loss functions and hyperparameters."
  - repo: mathis-dumont/mise-en-production
    title: "Credit Card Fraud Detection"
    parcours: "MLOps"
    stack: [FastAPI, Docker, Kubernetes, ArgoCD, XGBoost]
    website: https://mathis-dumont.github.io/mise-en-production/
    description:
      fr: "Modèle XGBoost qui estime la probabilité qu'une transaction par carte bancaire soit frauduleuse, servi par une API FastAPI déployée sur Kubernetes avec ArgoCD."
      en: "XGBoost model that estimates the probability that a credit card transaction is fraudulent, served by a FastAPI API deployed on Kubernetes with ArgoCD."
  - repo: gabrielfrancois/Vit-Pytorch
    title: "Dynamic Vision Transformers: Multi-Stage Compression Pipeline"
    parcours: "MLOps"
    stack: [PyTorch, DINOv2, uv, Hugging Face Datasets]
    website: https://gabrielfrancois.github.io/Vit-Pytorch/
    description:
      fr: "Pipeline d'entraînement et de compression de Vision Transformers sur ImageNet en 128x128 : pré-entraînement MAE, fine-tuning avec REPA, puis distillation vers un DynamicViT plus léger pour l'inférence."
      en: "Training and compression pipeline for Vision Transformers on ImageNet at 128x128: MAE pre-training, fine-tuning with REPA, then distillation into a lighter DynamicViT for inference."
  - repo: KingDonatien/Mise-en-production-des-projets-de-data-science
    title: "Energy Reserve Management"
    parcours: "MLOps"
    stack: [Flask, Docker, Pydantic, Quarto]
    description:
      fr: "Modèle de prévision probabiliste par régression quantile pour dimensionner les réserves d'électricité sur les marchés de l'énergie, servi par une API Flask dans un conteneur Docker. Rapport en site Quarto."
      en: "Probabilistic forecasting model using quantile regression to size electricity reserves on energy markets, served by a Flask API in a Docker container. Report built as a Quarto website."
  - repo: apidburachynskyi/F1_telemetrydashboard
    title: "F1 Telemetry Dashboard"
    parcours: "Dashboard / app"
    stack: [Dash, FastF1, Plotly, Docker, ArgoCD]
    website: https://f1-dashboard.user.lab.sspcloud.fr/
    description:
      fr: "Tableau de bord interactif sur les données de Formule 1 (télémétrie, résultats, arrêts au stand, classements), construit avec Dash et FastF1, pour explorer les courses sans manipuler les données brutes."
      en: "Interactive dashboard on Formula 1 data (telemetry, results, pit stops, standings), built with Dash and FastF1, to explore races without handling raw data."
  - repo: aayrapet/FastCrowdVision
    title: "FastCrowdVision"
    parcours: "MLOps"
    stack: [FastAPI, Docker, Kubernetes, WandB]
    website: https://testwebmodel.natka.ovh/
    description:
      fr: "Détection et comptage de personnes en temps réel sur vidéo avec un modèle SSDLite + MobileNetV3 entraîné sur WiderPeople, servi par une API FastAPI et WebSocket, conteneurisé et déployé sur Kubernetes."
      en: "Real-time people detection and counting on video with an SSDLite + MobileNetV3 model trained on WiderPeople, served through a FastAPI and WebSocket API, containerised and deployed on Kubernetes."
  - repo: Sanjopp/MEP_2026_ALAMIDRIDEB_BOULIAIRE_KOUKA_SAMAMA
    title: "How Does Batch Normalization Really Help Optimization?"
    parcours: "MLOps"
    stack: [PyTorch, MLflow, FastAPI, Helm, ArgoCD]
    website: https://batchnorm-api.user-sanjopp.lab.sspcloud.fr
    description:
      fr: "Expériences contrôlées sur l'effet de la Batch Normalization sur l'optimisation de réseaux MLP et CNN (CIFAR-10, Fashion-MNIST), avec suivi MLflow et API déployée sur Kubernetes via Helm."
      en: "Controlled experiments on how Batch Normalization affects optimisation of MLP and CNN networks (CIFAR-10, Fashion-MNIST), with MLflow tracking and an API deployed on Kubernetes with Helm."
  - repo: anhlinhpiketty/Mise_en_production_DS
    title: "JobLess"
    parcours: "Dashboard / app"
    stack: [FastAPI, Streamlit, spaCy, Docker, ArgoCD]
    website: https://jobless-website.lab.sspcloud.fr/
    description:
      fr: "Outil d'extraction des compétences présentes dans les offres d'emploi : un modèle NER spaCy repère les compétences, puis un LLM les classe selon une taxonomie de l'INSEE, via une API FastAPI et une interface Streamlit."
      en: "Tool that extracts skills from job postings: a spaCy NER model finds them, then an LLM classifies them with an INSEE taxonomy, through a FastAPI API and a Streamlit interface."
  - repo: kellybourbon2/Loan-prediction-approval
    title: "Loan Prediction Approval"
    parcours: "MLOps"
    stack: [MLflow, FastAPI, Docker, Kubernetes, ArgoCD, Prometheus]
    website: https://loan-api-user-kbourbon.user.lab.sspcloud.fr
    description:
      fr: "Pipeline MLOps qui entraîne des modèles d'acceptation de prêt, suit les expériences dans MLflow et sert les prédictions via une API FastAPI sur Kubernetes, avec supervision Prometheus et réentraînement en cas de dérive."
      en: "MLOps pipeline that trains loan approval models, tracks experiments in MLflow and serves predictions through a FastAPI API on Kubernetes, with Prometheus monitoring and retraining when data drift is detected."
  - repo: mateomolinaro1/ml-and-backtester-app
    title: "ML and Backtester App"
    parcours: "Dashboard / app"
    stack: [Render, Docker, MLflow, pytest, GitHub Actions]
    website: https://ml-and-backtester-app-latest.onrender.com/
    description:
      fr: "Application sans code qui produit des allocations de portefeuille dynamiques à partir de données macroéconomiques, avec un moteur de backtest de stratégies de classement. Déployée sur Render."
      en: "No-code application that produces dynamic portfolio allocations from macroeconomic data, with a backtesting engine for univariate ranking strategies. Deployed on Render."
  - repo: MaxCoppa/MLOps-Prediction-Market
    title: "MLOps Prediction Market"
    parcours: "MLOps"
    stack: [LightGBM, Optuna, MLflow, FastAPI, Docker]
    website: https://maxcoppa.github.io/MLOps-Prediction-Market/
