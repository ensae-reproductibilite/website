  - repo: Kirscher/ResultAthle
    title: "ResultAthle"
    parcours: "Dashboard / app"
    website: https://kirscher.github.io/ResultAthle/
    description:
      fr: "`ResultAthle` est un projet visant à rendre les outils statistiques d'analyse de performance plus accessibles au niveau amateur en athlétisme. Il aborde les défis de la collecte de résultats et le manque de statistiques descriptives accessibles pour les clubs."
      en: "`ResultAthle` is a project that aims to make statistical tools for performance analysis more accessible to amateur athletics. It addresses the challenges of collecting results and the lack of accessible descriptive statistics for clubs."
