<style>
:root {
  --appli-nav-offset: 0px;
}
.callout-application[id^="appli-"] {
  scroll-margin-top: calc(var(--appli-nav-offset) + 12px);
}

/* Terminal palette shared by the sidebar, the banner and its panel.
   --term-phosphor is defined site-wide with a legible dark green in light mode. */
.appli-nav-banner,
#appli-nav-sidebar {
  --appli-ink: var(--term-phosphor, #33ff66);
}

/* Left sidebar (wide screens only): sits in a dedicated column left of the
   content, from the page start to the outset of the body. */
#quarto-content > #appli-nav-sidebar {
  display: none;
  grid-column: page-start / body-start-outset;
  grid-row: content-top / page-bottom;
  min-width: 0;
  z-index: 1;
  padding: 0;
  margin: 0 0.75rem 0 0;
}
@media (min-width: 1200px) {
  #quarto-content > #appli-nav-sidebar {
    display: block;
  }
  /* Carve a real left column (210-260px) out of the Quarto grid when the
     sidebar is present. Line names are kept so that other elements
     (margin TOC, callouts, figures, .column-page) still align. */
  body #quarto-content.page-columns.has-appli-sidebar {
    grid-template-columns: [screen-start] 1.5em [screen-start-inset] 1fr [page-start page-start-inset] minmax(210px, 260px) [body-start-outset] 1.5em [body-start] 1.5em [body-content-start] minmax(500px, calc(850px - 3em)) [body-content-end] 1.5em [body-end] 35px [body-end-outset] minmax(75px, 145px) [page-end-inset] 35px [page-end] 1fr [screen-end-inset] 1.5em [screen-end];
  }
}
#appli-nav-sidebar .appli-nav-sticky {
  position: sticky;
  top: var(--appli-nav-top, 80px);
  display: flex;
  flex-direction: column;
  width: 100%;
  max-height: calc(100vh - var(--appli-nav-top, 80px) - 1rem);
  margin-top: 1rem;
  background: var(--term-bg, #fff);
  color: var(--term-fg, #3d3d3a);
  border: 1px solid var(--term-border, #dedcd1);
  border-radius: 0;
  font-family: "JetBrains Mono", "Fira Code", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.78rem;
  line-height: 1.35;
}
body.quarto-dark #appli-nav-sidebar .appli-nav-sticky {
  box-shadow: 0 0 14px var(--term-glow-text, transparent);
}
/* Scanlines: dark mode only, purely decorative. */
body.quarto-dark #appli-nav-sidebar .appli-nav-sticky::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0, 0, 0, 0) 0,
    rgba(0, 0, 0, 0) 2px,
    rgba(0, 0, 0, 0.14) 3px,
    rgba(0, 0, 0, 0) 4px
  );
}
.appli-nav-head {
  padding: 0.5rem 0.75rem 0.5rem;
  border-bottom: 1px solid var(--term-rule, #d9d6cb);
  color: var(--term-dim, #a8a59b);
  font-size: 0.7rem;
  white-space: nowrap;
  overflow: hidden;
}
.appli-nav-prompt {
  color: var(--appli-ink);
}
.appli-nav-head-title {
  color: var(--term-fg, #3d3d3a);
  letter-spacing: 0.06em;
}
#appli-nav-sidebar .appli-nav-list {
  flex: 1 1 auto;
  min-height: 0;
  max-height: none;
  overflow-y: auto;
  margin: 0;
  padding: 0 0.4rem 0.6rem 0.6rem;
}

.appli-nav-list {
  position: relative;
  max-height: calc(100vh - 220px);
  overflow-y: auto;
  margin-bottom: 0.5rem;
  padding-right: 0.25rem;
  font-family: "JetBrains Mono", "Fira Code", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.78rem;
  line-height: 1.35;
  scrollbar-width: thin;
}
.appli-nav-count {
  padding: 0.4rem 0 0.3rem;
  font-size: 0.7rem;
  color: var(--term-dim, #a8a59b);
}
.appli-nav-part {
  margin: 0.8rem 0 0.25rem;
  padding: 0 0.2rem;
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--term-dim, #a8a59b);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.appli-nav-part::before {
  content: "── ";
}
.appli-nav-row {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.2rem 0.3rem 0.2rem 0.2rem;
  border-left: 2px solid transparent;
  cursor: pointer;
}
.appli-nav-row:hover {
  background: var(--term-accent-soft, rgba(127, 127, 127, 0.08));
}
/* Prompt marker of the current row. */
.appli-nav-caret {
  flex: 0 0 1ch;
  color: transparent;
}
.appli-nav-row.is-current .appli-nav-caret {
  color: var(--appli-ink);
}
/* Real checkbox kept for accessibility; drawn as [ ] / [x]. */
.appli-nav-check {
  flex: 0 0 auto;
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  width: 3ch;
  height: 1.35em;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  font: inherit;
  line-height: 1.35em;
  color: var(--term-dim, #a8a59b);
  cursor: pointer;
}
.appli-nav-check::before {
  content: "[ ]";
  white-space: pre;
}
.appli-nav-check:checked::before {
  content: "[x]";
  color: var(--appli-ink);
}
.appli-nav-check:focus-visible {
  outline: 1px dotted var(--appli-ink);
  outline-offset: 2px;
}
.appli-nav-num {
  flex: 0 0 3ch;
  text-align: right;
  white-space: nowrap;
  color: var(--term-dim, #a8a59b);
}
.appli-nav-title {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  color: var(--term-fg, #3d3d3a);
  text-decoration: none;
}
.appli-nav-title:hover {
  text-decoration: none;
  color: var(--appli-ink);
}
.appli-nav-title:focus-visible {
  outline: 1px dotted var(--appli-ink);
}
/* Blinking block cursor after the current title. */
.appli-nav-cursor {
  flex: 0 0 auto;
  visibility: hidden;
  color: var(--appli-ink);
}
.appli-nav-row.is-current .appli-nav-cursor {
  visibility: visible;
  animation: term-blink 1.06s steps(1) infinite;
}
.appli-nav-row.is-optional .appli-nav-title {
  font-style: italic;
  color: var(--term-dim, #a8a59b);
}
.appli-nav-row.is-done .appli-nav-title,
.appli-nav-row.is-done .appli-nav-num {
  text-decoration: line-through;
  color: var(--term-dim, #a8a59b);
}
.appli-nav-row.is-done .appli-nav-num {
  text-decoration: none;
}
.appli-nav-row.is-current {
  border-left-color: var(--appli-ink);
  background: var(--term-accent-soft, rgba(127, 127, 127, 0.08));
}
.appli-nav-row.is-current .appli-nav-title,
.appli-nav-row.is-current .appli-nav-num {
  color: var(--appli-ink);
  font-weight: 600;
}
body.quarto-dark .appli-nav-row.is-current .appli-nav-title {
  text-shadow: 0 0 6px var(--term-glow-strong, rgba(51, 255, 102, 0.5));
}

.appli-nav-banner {
  position: fixed;
  left: 0;
  right: 0;
  top: 0;
  z-index: 1020;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-6px);
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
}
.appli-nav-banner.is-visible {
  opacity: 1;
  visibility: visible;
  transform: none;
  pointer-events: auto;
}
.appli-nav-banner-btn {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  width: 100%;
  height: 32px;
  margin: 0;
  padding: 0 1rem;
  border: 0;
  border-bottom: 1px solid var(--term-border, #dedcd1);
  border-radius: 0;
  background: var(--term-bg, #fff);
  color: var(--term-fg, #3d3d3a);
  font-family: "JetBrains Mono", "Fira Code", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.75rem;
  text-align: left;
  cursor: pointer;
}
.appli-nav-banner-btn::before {
  content: "$ ";
  flex: 0 0 auto;
  color: var(--appli-ink);
}
.appli-nav-banner-text {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.appli-nav-banner-count {
  white-space: nowrap;
  color: var(--term-dim, #a8a59b);
}
.appli-nav-banner-caret {
  color: var(--appli-ink);
  transition: transform 0.2s ease;
}
.appli-nav-banner-btn[aria-expanded="true"] .appli-nav-banner-caret {
  transform: rotate(180deg);
}
.appli-nav-panel {
  position: absolute;
  left: 0;
  right: 0;
  top: 100%;
  overflow-y: auto;
  padding: 0.5rem 1rem 0.75rem;
  background: var(--term-bg, #fff);
  color: var(--term-fg, #3d3d3a);
  border-bottom: 1px solid var(--term-border, #dedcd1);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
}
.appli-nav-panel[hidden] {
  display: none;
}
.appli-nav-panel .appli-nav-list {
  max-height: min(70vh, 480px);
}

@media (min-width: 1200px) {
  .appli-nav-banner {
    display: none !important;
  }
}
@media (prefers-reduced-motion: reduce) {
  .appli-nav-banner,
  .appli-nav-banner-caret {
    transition: none;
  }
  .appli-nav-row.is-current .appli-nav-cursor {
    animation: none;
  }
}
@media print {
  #appli-nav-sidebar,
  .appli-nav-banner {
    display: none !important;
  }
}
</style>
<script>
(function () {
  "use strict";

  var MIN_APPLICATIONS = 5;
  var DONE_PREFIX = "appli-nav:done:";
  var TITLE_RE = /application\s+(?:pr[ée]liminaire\s+(\d+)|(\d+[a-z]?))/i;

  var isFr = (document.documentElement.lang || "").indexOf("fr") === 0;
  var L = isFr
    ? {
        applications: "Applications",
        done: "faites",
        markDone: "Marquer comme faite",
        openList: "Afficher la liste des applications",
        preliminary: "préliminaire",
        part: "Partie"
      }
    : {
        applications: "Applications",
        done: "done",
        markDone: "Mark as done",
        openList: "Show the applications list",
        preliminary: "preliminary",
        part: "Part"
      };

  function storageGet(key) {
    try {
      return window.localStorage.getItem(key);
    } catch (e) {
      return null;
    }
  }

  function storageSet(key, value) {
    try {
      if (value === null) window.localStorage.removeItem(key);
      else window.localStorage.setItem(key, value);
    } catch (e) {}
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function cleanText(node) {
    var clone = node.cloneNode(true);
    var junk = clone.querySelectorAll(".screen-reader-only, .anchor, .header-section-number");
    Array.prototype.forEach.call(junk, function (n) {
      n.parentNode.removeChild(n);
    });
    return clone.textContent.replace(/\s+/g, " ").trim();
  }

  function reduceMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  document.addEventListener("DOMContentLoaded", function () {
    var callouts = document.querySelectorAll(".callout-application");
    if (callouts.length < MIN_APPLICATIONS) return;

    // Parsing ----------------------------------------------------------------
    var items = [];
    var used = {};
    Array.prototype.forEach.call(callouts, function (callout) {
      var titleBox = callout.querySelector(".callout-title-container");
      if (!titleBox) return;
      var title = cleanText(titleBox);
      var m = TITLE_RE.exec(title);
      if (!m) return;

      var label, display;
      if (m[1]) {
        label = "P" + m[1];
        display = L.preliminary + " " + m[1];
      } else {
        label = m[2].toLowerCase();
        display = label;
      }

      var colon = title.indexOf(":");
      var shortTitle =
        colon >= 0
          ? title.slice(colon + 1).trim()
          : title.slice(m.index + m[0].length).trim();
      if (!shortTitle) shortTitle = title;

      var section = callout.closest("section.level1");
      var h1 = section ? section.querySelector(":scope > h1") : null;
      var part = h1 ? cleanText(h1) : "";

      var base = "appli-" + label.toLowerCase();
      var id = base;
      var n = 2;
      while (used[id] || document.getElementById(id)) {
        id = base + "-" + n;
        n++;
      }
      used[id] = true;
      callout.id = id;

      var doneRaw = storageGet(DONE_PREFIX + id);
      items.push({
        id: id,
        el: callout,
        label: label,
        display: display,
        short: shortTitle,
        full: title,
        optional: /optionnel/i.test(title),
        part: part,
        done: doneRaw === "1",
        rows: [],
        checks: [],
        titles: []
      });
    });
    if (!items.length) return;

    var total = items.length;
    var padWidth = String(total).length;
    var counters = [];
    var current = null;
    var lastRevealed = null;
    var navHeight = 0;
    var bannerHeight = 0;

    function pad(n) {
      var s = String(n);
      while (s.length < padWidth) s = "0" + s;
      return s;
    }

    function fraction(doneN) {
      return "[" + pad(doneN) + "/" + pad(total) + "] " + L.done;
    }

    function shortPart(part) {
      var idx = part.indexOf(":");
      return idx >= 0 ? part.slice(0, idx).trim() : part;
    }

    function countDone() {
      var n = 0;
      items.forEach(function (it) {
        if (it.done) n++;
      });
      return n;
    }

    function scrollOffset() {
      return navHeight + bannerHeight + 12;
    }

    // La barre de Quarto (headroom) se masque en descendant : on se cale sur
    // son bord inférieur visible, pas sur sa hauteur.
    var header = document.getElementById("quarto-header");

    function measure() {
      navHeight = header ? Math.max(0, header.getBoundingClientRect().bottom) : 0;
      // offsetHeight vaut 0 quand la bannière est masquée (écrans larges) :
      // pas de repli sur une valeur fixe.
      bannerHeight = banner.offsetHeight;
      banner.style.top = navHeight + "px";
      sidebar.style.setProperty("--appli-nav-top", navHeight + 12 + "px");
      document.documentElement.style.setProperty(
        "--appli-nav-offset",
        navHeight + bannerHeight + "px"
      );
      panel.style.maxHeight = Math.max(120, window.innerHeight - navHeight - bannerHeight - 16) + "px";
    }

    function goTo(it) {
      var y = it.el.getBoundingClientRect().top + window.pageYOffset - scrollOffset();
      window.scrollTo({ top: Math.max(0, y), behavior: reduceMotion() ? "auto" : "smooth" });
      try {
        history.replaceState(null, "", "#" + it.id);
      } catch (e) {}
    }

    function findCurrent() {
      var threshold = navHeight + 0.3 * window.innerHeight;
      for (var i = items.length - 1; i >= 0; i--) {
        if (items[i].el.getBoundingClientRect().top < threshold) return items[i];
      }
      return null;
    }

    function reveal(row) {
      var box = row.parentNode;
      if (!box || !box.clientHeight) return;
      var top = row.offsetTop;
      var bottom = top + row.offsetHeight;
      if (top < box.scrollTop) {
        box.scrollTop = Math.max(0, top - 8);
      } else if (bottom > box.scrollTop + box.clientHeight) {
        box.scrollTop = bottom - box.clientHeight + 8;
      }
    }

    function render() {
      var doneN = countDone();
      items.forEach(function (it) {
        var isCurrent = it === current;
        it.rows.forEach(function (r) {
          r.classList.toggle("is-current", isCurrent);
          r.classList.toggle("is-done", it.done);
        });
        it.checks.forEach(function (c) {
          c.checked = it.done;
        });
        it.titles.forEach(function (t) {
          if (isCurrent) t.setAttribute("aria-current", "true");
          else t.removeAttribute("aria-current");
        });
      });

      counters.forEach(function (node) {
        node.textContent = fraction(doneN);
      });

      if (current) {
        bannerText.textContent =
          shortPart(current.part) + " · " + "Application " + current.display + " — " + current.short;
        bannerCount.textContent = fraction(doneN);
        banner.classList.add("is-visible");
        if (lastRevealed !== current) {
          current.rows.forEach(reveal);
        }
      } else {
        banner.classList.remove("is-visible");
        setPanel(false);
      }
      lastRevealed = current;
    }

    function onRowActivate(it, box) {
      goTo(it);
      if (box.parentNode === panel) setPanel(false);
    }

    function buildList(extraClass) {
      var box = el("div", "appli-nav-list " + extraClass);
      var count = el("div", "appli-nav-count");
      box.appendChild(count);
      counters.push(count);

      var lastPart = null;
      items.forEach(function (it) {
        if (it.part !== lastPart) {
          lastPart = it.part;
          if (it.part) box.appendChild(el("div", "appli-nav-part", it.part));
        }

        var row = el("div", "appli-nav-row");
        if (it.optional) row.classList.add("is-optional");

        var caret = el("span", "appli-nav-caret", ">");
        caret.setAttribute("aria-hidden", "true");

        var check = el("input");
        check.type = "checkbox";
        check.className = "appli-nav-check";
        check.setAttribute("aria-label", L.markDone + " : " + it.label + " " + it.short);

        var num = el("span", "appli-nav-num", it.label);
        var title = el("a", "appli-nav-title", it.short);
        title.href = "#" + it.id;
        title.title = it.full;

        var cursor = el("span", "appli-nav-cursor", "▋");
        cursor.setAttribute("aria-hidden", "true");

        row.appendChild(caret);
        row.appendChild(check);
        row.appendChild(num);
        row.appendChild(title);
        row.appendChild(cursor);

        row.addEventListener("click", function (e) {
          if (e.target === check) return;
          e.preventDefault();
          onRowActivate(it, box);
        });
        check.addEventListener("change", function () {
          it.done = check.checked;
          storageSet(DONE_PREFIX + it.id, it.done ? "1" : null);
          render();
        });

        it.rows.push(row);
        it.checks.push(check);
        it.titles.push(title);
        box.appendChild(row);
      });
      return box;
    }

    // Left sidebar (wide screens, >= 1200px) ---------------------------------
    var sidebar = el("aside");
    sidebar.id = "appli-nav-sidebar";
    sidebar.setAttribute("aria-label", L.applications);
    var sticky = el("div", "appli-nav-sticky");
    var head = el("div", "appli-nav-head");
    head.appendChild(el("div", "appli-nav-prompt", "~/appli $ ls"));
    var headTitle = el("div", "appli-nav-head-title", "┌─[ " + L.applications.toUpperCase() + " ]");
    head.appendChild(headTitle);
    sticky.appendChild(head);
    sticky.appendChild(buildList("appli-nav-side-list"));
    sidebar.appendChild(sticky);

    var content = document.getElementById("quarto-content");
    if (content) {
      content.classList.add("has-appli-sidebar");
      var main = document.getElementById("quarto-document-content");
      content.insertBefore(sidebar, main && main.parentNode === content ? main : content.firstChild);
    }

    // Banner (narrow screens, < 1200px) --------------------------------------
    var banner = el("div", "appli-nav-banner");
    var bannerBtn = el("button", "appli-nav-banner-btn");
    bannerBtn.type = "button";
    bannerBtn.setAttribute("aria-expanded", "false");
    bannerBtn.setAttribute("aria-controls", "appli-nav-panel");
    bannerBtn.setAttribute("aria-label", L.openList);
    var bannerText = el("span", "appli-nav-banner-text");
    var bannerCount = el("span", "appli-nav-banner-count");
    var bannerCaret = el("span", "appli-nav-banner-caret", "▾");
    bannerCaret.setAttribute("aria-hidden", "true");
    bannerBtn.appendChild(bannerText);
    bannerBtn.appendChild(bannerCount);
    bannerBtn.appendChild(bannerCaret);

    var panel = el("div", "appli-nav-panel");
    panel.id = "appli-nav-panel";
    panel.hidden = true;
    panel.appendChild(buildList("appli-nav-panel-list"));

    banner.appendChild(bannerBtn);
    banner.appendChild(panel);
    document.body.appendChild(banner);

    function setPanel(open) {
      panel.hidden = !open;
      bannerBtn.setAttribute("aria-expanded", open ? "true" : "false");
    }

    bannerBtn.addEventListener("click", function () {
      setPanel(panel.hidden);
    });
    document.addEventListener("click", function (e) {
      if (!panel.hidden && !banner.contains(e.target)) setPanel(false);
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !panel.hidden) {
        setPanel(false);
        bannerBtn.focus();
      }
    });

    // Scrollspy --------------------------------------------------------------
    var frame = null;
    function schedule() {
      if (frame) return;
      frame = window.requestAnimationFrame(function () {
        frame = null;
        measure();
        var next = findCurrent();
        if (next !== current) {
          current = next;
          render();
        }
      });
    }

    window.addEventListener("scroll", schedule, { passive: true });
    window.addEventListener("resize", function () {
      measure();
      schedule();
    });

    if (header) header.addEventListener("transitionend", schedule);

    measure();

    // Lien direct vers une application (#appli-12) : les identifiants n'existaient
    // pas encore quand le navigateur a traité l'ancre.
    var hash = decodeURIComponent(location.hash.slice(1));
    items.forEach(function (it) {
      if (it.id === hash) {
        var y = it.el.getBoundingClientRect().top + window.pageYOffset - scrollOffset();
        window.scrollTo(0, Math.max(0, y));
      }
    });

    current = findCurrent();
    render();
  });
})();
</script>
