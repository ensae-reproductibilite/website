<style>
:root {
  --appli-nav-offset: 0px;
  --appli-nav-mono: "JetBrains Mono", "Fira Code", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.callout-application[id^="appli-"] {
  scroll-margin-top: calc(var(--appli-nav-offset) + 12px);
}

/* Terminal palette shared by the rail, the banner and its panel.
   --term-phosphor is defined site-wide with a legible dark green in light mode. */
.appli-nav-banner,
#appli-nav-sidebar {
  --appli-ink: var(--term-phosphor, #33ff66);
}

/* Left rail: a fixed box next to the text, shown only when there is room
   on the left of the content (see measure() in the script). */
#appli-nav-sidebar {
  display: none;
  position: fixed;
  left: 0.75rem;
  top: var(--appli-nav-top, 80px);
  z-index: 1010;
  flex-direction: column;
  box-sizing: border-box;
  max-height: calc(100vh - var(--appli-nav-top, 80px) - 1rem);
  background: var(--term-bg, #fff);
  color: var(--term-fg, #3d3d3a);
  border: 1px solid var(--term-border, #dedcd1);
  font-family: var(--appli-nav-mono);
  font-size: 0.7rem;
  line-height: 1.25;
  opacity: 0.95;
}
#appli-nav-sidebar.is-on {
  display: flex;
}
.appli-rail-on .appli-nav-banner {
  display: none !important;
}
.appli-nav-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.3rem 0.5rem;
  border-bottom: 1px solid var(--term-rule, #d9d6cb);
  white-space: nowrap;
  overflow: hidden;
}
.appli-nav-prompt {
  color: var(--appli-ink);
}
.appli-nav-counter {
  color: var(--term-dim, #a8a59b);
}
.appli-nav-list {
  position: relative;
  overflow-y: auto;
  padding: 0.2rem 0.25rem 0.4rem;
  font-family: var(--appli-nav-mono);
  font-size: 0.7rem;
  line-height: 1.25;
  scrollbar-width: thin;
}
#appli-nav-sidebar .appli-nav-list {
  flex: 1 1 auto;
  min-height: 0;
}
.appli-nav-count {
  padding: 0.4rem 0.25rem 0.2rem;
  color: var(--term-dim, #a8a59b);
}
.appli-nav-part {
  display: block;
  width: 100%;
  margin: 0.35rem 0 0.1rem;
  padding: 0.15rem 0.25rem;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--term-dim, #a8a59b);
  font: inherit;
  font-size: 0.62rem;
  text-align: left;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}
.appli-nav-part:hover {
  color: var(--appli-ink);
}
.appli-nav-part:focus-visible {
  outline: 1px dotted var(--appli-ink);
  outline-offset: -1px;
}
.appli-nav-group[hidden] {
  display: none;
}
.appli-nav-row {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.08rem 0.25rem 0.08rem 0.2rem;
  border-left: 2px solid transparent;
  cursor: pointer;
}
.appli-nav-row:hover {
  background: var(--term-accent-soft, rgba(127, 127, 127, 0.08));
}
/* Prompt marker of the current row. */
.appli-nav-caret {
  flex: 0 0 1ch;
  color: transparent;
}
.appli-nav-row.is-current .appli-nav-caret {
  color: var(--appli-ink);
}
/* Real checkbox kept for accessibility; drawn as [ ] / [x]. */
.appli-nav-check {
  flex: 0 0 auto;
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  width: 3ch;
  height: 1.25em;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  font: inherit;
  line-height: 1.25em;
  color: var(--term-dim, #a8a59b);
  cursor: pointer;
}
.appli-nav-check::before {
  content: "[ ]";
  white-space: pre;
}
.appli-nav-check:checked::before {
  content: "[x]";
  color: var(--appli-ink);
}
.appli-nav-check:focus-visible {
  outline: 1px dotted var(--appli-ink);
  outline-offset: 2px;
}
.appli-nav-num {
  flex: 0 0 3ch;
  text-align: right;
  white-space: nowrap;
  color: var(--term-dim, #a8a59b);
}
.appli-nav-title {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  color: var(--term-fg, #3d3d3a);
  text-decoration: none;
}
.appli-nav-title:hover {
  text-decoration: none;
  color: var(--appli-ink);
}
.appli-nav-title:focus-visible {
  outline: 1px dotted var(--appli-ink);
}
/* Blinking block cursor after the current title. */
.appli-nav-cursor {
  flex: 0 0 auto;
  visibility: hidden;
  color: var(--appli-ink);
}
.appli-nav-row.is-current .appli-nav-cursor {
  visibility: visible;
  animation: term-blink 1.06s steps(1) infinite;
}
.appli-nav-row.is-optional .appli-nav-title {
  font-style: italic;
  color: var(--term-dim, #a8a59b);
}
.appli-nav-row.is-done .appli-nav-title,
.appli-nav-row.is-done .appli-nav-num {
  text-decoration: line-through;
  color: var(--term-dim, #a8a59b);
}
.appli-nav-row.is-done .appli-nav-num {
  text-decoration: none;
}
.appli-nav-row.is-current {
  border-left-color: var(--appli-ink);
  background: var(--term-accent-soft, rgba(127, 127, 127, 0.08));
}
.appli-nav-row.is-current .appli-nav-title,
.appli-nav-row.is-current .appli-nav-num {
  color: var(--appli-ink);
  font-weight: 600;
}
body.quarto-dark .appli-nav-row.is-current .appli-nav-title {
  text-shadow: 0 0 4px var(--term-glow-strong, rgba(51, 255, 102, 0.35));
}

/* Top banner (when the rail does not fit). */
.appli-nav-banner {
  position: fixed;
  left: 0;
  right: 0;
  top: 0;
  z-index: 1020;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-6px);
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
}
.appli-nav-banner.is-visible {
  opacity: 1;
  visibility: visible;
  transform: none;
  pointer-events: auto;
}
.appli-nav-banner-btn {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  width: 100%;
  height: 32px;
  margin: 0;
  padding: 0 1rem;
  border: 0;
  border-bottom: 1px solid var(--term-border, #dedcd1);
  border-radius: 0;
  background: var(--term-bg, #fff);
  color: var(--term-fg, #3d3d3a);
  font-family: var(--appli-nav-mono);
  font-size: 0.75rem;
  text-align: left;
  cursor: pointer;
}
.appli-nav-banner-btn::before {
  content: "$ ";
  flex: 0 0 auto;
  color: var(--appli-ink);
}
.appli-nav-banner-text {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.appli-nav-banner-count {
  white-space: nowrap;
  color: var(--term-dim, #a8a59b);
}
.appli-nav-banner-caret {
  color: var(--appli-ink);
  transition: transform 0.2s ease;
}
.appli-nav-banner-btn[aria-expanded="true"] .appli-nav-banner-caret {
  transform: rotate(180deg);
}
.appli-nav-panel {
  position: absolute;
  left: 0;
  right: 0;
  top: 100%;
  overflow-y: auto;
  padding: 0.5rem 1rem 0.75rem;
  background: var(--term-bg, #fff);
  color: var(--term-fg, #3d3d3a);
  border-bottom: 1px solid var(--term-border, #dedcd1);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
  font-family: var(--appli-nav-mono);
}
.appli-nav-panel[hidden] {
  display: none;
}
.appli-nav-panel .appli-nav-list {
  max-height: min(70vh, 480px);
  padding: 0;
}

@media (prefers-reduced-motion: reduce) {
  .appli-nav-banner,
  .appli-nav-banner-caret {
    transition: none;
  }
  .appli-nav-row.is-current .appli-nav-cursor {
    animation: none;
  }
}
@media print {
  #appli-nav-sidebar,
  .appli-nav-banner {
    display: none !important;
  }
}
</style>
<script>
(function () {
  "use strict";

  var MIN_APPLICATIONS = 5;
  var DONE_PREFIX = "appli-nav:done:";
  var TITLE_RE = /application\s+(?:pr[ée]liminaire\s+(\d+)|(\d+[a-z]?))/i;
  // Rail geometry: left offset (0.75rem), gap before the text, width cap, and
  // the minimum free room under which the rail is not shown.
  var RAIL_LEFT = 12;
  var RAIL_GAP = 16;
  var RAIL_MAX_WIDTH = 230;
  var RAIL_MIN_ROOM = 170;

  var isFr = (document.documentElement.lang || "").indexOf("fr") === 0;
  var L = isFr
    ? {
        applications: "Applications",
        done: "faites",
        markDone: "Marquer comme faite",
        openList: "Afficher la liste des applications",
        preliminary: "préliminaire",
        part: "Partie"
      }
    : {
        applications: "Applications",
        done: "done",
        markDone: "Mark as done",
        openList: "Show the applications list",
        preliminary: "preliminary",
        part: "Part"
      };

  function storageGet(key) {
    try {
      return window.localStorage.getItem(key);
    } catch (e) {
      return null;
    }
  }

  function storageSet(key, value) {
    try {
      if (value === null) window.localStorage.removeItem(key);
      else window.localStorage.setItem(key, value);
    } catch (e) {}
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function cleanText(node) {
    var clone = node.cloneNode(true);
    var junk = clone.querySelectorAll(".screen-reader-only, .anchor, .header-section-number");
    Array.prototype.forEach.call(junk, function (n) {
      n.parentNode.removeChild(n);
    });
    return clone.textContent.replace(/\s+/g, " ").trim();
  }

  function reduceMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  document.addEventListener("DOMContentLoaded", function () {
    var callouts = document.querySelectorAll(".callout-application");
    if (callouts.length < MIN_APPLICATIONS) return;

    // Parsing ----------------------------------------------------------------
    var items = [];
    var used = {};
    Array.prototype.forEach.call(callouts, function (callout) {
      var titleBox = callout.querySelector(".callout-title-container");
      if (!titleBox) return;
      var title = cleanText(titleBox);
      var m = TITLE_RE.exec(title);
      if (!m) return;

      var label, display;
      if (m[1]) {
        label = "P" + m[1];
        display = L.preliminary + " " + m[1];
      } else {
        label = m[2].toLowerCase();
        display = label;
      }

      var colon = title.indexOf(":");
      var shortTitle =
        colon >= 0
          ? title.slice(colon + 1).trim()
          : title.slice(m.index + m[0].length).trim();
      if (!shortTitle) shortTitle = title;

      var section = callout.closest("section.level1");
      var h1 = section ? section.querySelector(":scope > h1") : null;
      var part = h1 ? cleanText(h1) : "";

      var base = "appli-" + label.toLowerCase();
      var id = base;
      var n = 2;
      while (used[id] || document.getElementById(id)) {
        id = base + "-" + n;
        n++;
      }
      used[id] = true;
      callout.id = id;

      var doneRaw = storageGet(DONE_PREFIX + id);
      items.push({
        id: id,
        el: callout,
        label: label,
        display: display,
        short: shortTitle,
        full: title,
        optional: /optionnel/i.test(title),
        part: part,
        group: null,
        done: doneRaw === "1",
        rows: [],
        checks: [],
        titles: []
      });
    });
    if (!items.length) return;

    // Groups: one per part (consecutive applications sharing the same H1).
    var groups = [];
    items.forEach(function (it) {
      var g = groups[groups.length - 1];
      if (!g || g.part !== it.part) {
        g = {
          part: it.part,
          collapsible: !!it.part,
          items: [],
          heads: [],
          bodies: [],
          open: false,
          auto: false
        };
        groups.push(g);
      }
      g.items.push(it);
      it.group = g;
    });

    var total = items.length;
    var padWidth = String(total).length;
    var counters = [];
    var railCounter = null;
    var current = null;
    var lastRevealed = null;
    var lastGroup = null;
    var navHeight = 0;
    var bannerHeight = 0;

    function pad(n) {
      var s = String(n);
      while (s.length < padWidth) s = "0" + s;
      return s;
    }

    function fraction(doneN) {
      return "[" + pad(doneN) + "/" + pad(total) + "] " + L.done;
    }

    function counterText(doneN) {
      return "[" + pad(doneN) + "/" + pad(total) + "]";
    }

    function shortPart(part) {
      var idx = part.indexOf(":");
      return idx >= 0 ? part.slice(0, idx).trim() : part;
    }

    function countDone() {
      var n = 0;
      items.forEach(function (it) {
        if (it.done) n++;
      });
      return n;
    }

    function groupDone(g) {
      var n = 0;
      g.items.forEach(function (it) {
        if (it.done) n++;
      });
      return n;
    }

    function scrollOffset() {
      return navHeight + bannerHeight + 12;
    }

    // La barre de Quarto (headroom) se masque en descendant : on se cale sur
    // son bord inférieur visible, pas sur sa hauteur.
    var header = document.getElementById("quarto-header");

    function measure() {
      navHeight = header ? Math.max(0, header.getBoundingClientRect().bottom) : 0;

      // Rail only when there is real room left of the text.
      var mainEl = document.getElementById("quarto-document-content") || document.querySelector("main");
      var room = mainEl ? mainEl.getBoundingClientRect().left - RAIL_LEFT - RAIL_GAP : 0;
      var railOn = room >= RAIL_MIN_ROOM;
      sidebar.classList.toggle("is-on", railOn);
      sidebar.style.width = railOn ? Math.min(RAIL_MAX_WIDTH, room) + "px" : "";
      document.documentElement.classList.toggle("appli-rail-on", railOn);

      // offsetHeight vaut 0 quand la bannière est masquée : pas de repli sur
      // une valeur fixe.
      bannerHeight = banner.offsetHeight;
      banner.style.top = navHeight + "px";
      sidebar.style.setProperty("--appli-nav-top", navHeight + 12 + "px");
      document.documentElement.style.setProperty(
        "--appli-nav-offset",
        navHeight + bannerHeight + "px"
      );
      panel.style.maxHeight = Math.max(120, window.innerHeight - navHeight - bannerHeight - 16) + "px";
    }

    function goTo(it) {
      var y = it.el.getBoundingClientRect().top + window.pageYOffset - scrollOffset();
      window.scrollTo({ top: Math.max(0, y), behavior: reduceMotion() ? "auto" : "smooth" });
      try {
        history.replaceState(null, "", "#" + it.id);
      } catch (e) {}
    }

    function findCurrent() {
      var threshold = navHeight + 0.3 * window.innerHeight;
      for (var i = items.length - 1; i >= 0; i--) {
        if (items[i].el.getBoundingClientRect().top < threshold) return items[i];
      }
      return null;
    }

    // Scroll the list that contains the row, if the row is visible at all
    // (a row in a collapsed part or a closed panel has no height).
    function reveal(row) {
      var box = row.closest(".appli-nav-list");
      if (!box || !box.clientHeight || !row.offsetHeight) return;
      var b = box.getBoundingClientRect();
      var r = row.getBoundingClientRect();
      if (r.top < b.top) {
        box.scrollTop -= b.top - r.top + 8;
      } else if (r.bottom > b.bottom) {
        box.scrollTop += r.bottom - b.bottom + 8;
      }
    }

    // Only the part of the current application is open by default. When the
    // current part changes, the new one opens and the previous one closes,
    // unless the reader opened it by hand (auto flag cleared).
    function syncGroups() {
      var g = current ? current.group : null;
      if (g === lastGroup) return;
      if (lastGroup && lastGroup.auto) {
        lastGroup.open = false;
        lastGroup.auto = false;
      }
      if (g && !g.open) {
        g.open = true;
        g.auto = true;
      }
      lastGroup = g;
    }

    function render() {
      var doneN = countDone();
      syncGroups();

      items.forEach(function (it) {
        var isCurrent = it === current;
        it.rows.forEach(function (r) {
          r.classList.toggle("is-current", isCurrent);
          r.classList.toggle("is-done", it.done);
        });
        it.checks.forEach(function (c) {
          c.checked = it.done;
        });
        it.titles.forEach(function (t) {
          if (isCurrent) t.setAttribute("aria-current", "true");
          else t.removeAttribute("aria-current");
        });
      });

      groups.forEach(function (g) {
        var label =
          (g.open ? "▾ " : "▸ ") +
          shortPart(g.part) +
          " · " +
          groupDone(g) +
          "/" +
          g.items.length;
        g.heads.forEach(function (h) {
          h.textContent = label;
          h.setAttribute("aria-expanded", g.open ? "true" : "false");
        });
        g.bodies.forEach(function (b) {
          b.hidden = g.collapsible && !g.open;
        });
      });

      counters.forEach(function (node) {
        node.textContent = fraction(doneN);
      });
      railCounter.textContent = counterText(doneN);

      if (current) {
        bannerText.textContent =
          shortPart(current.part) + " · " + "Application " + current.display + " — " + current.short;
        bannerCount.textContent = fraction(doneN);
        banner.classList.add("is-visible");
        if (lastRevealed !== current) {
          current.rows.forEach(reveal);
        }
      } else {
        banner.classList.remove("is-visible");
        setPanel(false);
      }
      lastRevealed = current;
    }

    function onRowActivate(it, inPanel) {
      goTo(it);
      if (inPanel) setPanel(false);
    }

    function buildRow(it, inPanel) {
      var row = el("div", "appli-nav-row");
      if (it.optional) row.classList.add("is-optional");

      var caret = el("span", "appli-nav-caret", ">");
      caret.setAttribute("aria-hidden", "true");

      var check = el("input");
      check.type = "checkbox";
      check.className = "appli-nav-check";
      check.setAttribute("aria-label", L.markDone + " : " + it.label + " " + it.short);

      var num = el("span", "appli-nav-num", it.label);
      var title = el("a", "appli-nav-title", it.short);
      title.href = "#" + it.id;
      title.title = it.full;

      var cursor = el("span", "appli-nav-cursor", "▋");
      cursor.setAttribute("aria-hidden", "true");

      row.appendChild(caret);
      row.appendChild(check);
      row.appendChild(num);
      row.appendChild(title);
      row.appendChild(cursor);

      row.addEventListener("click", function (e) {
        if (e.target === check) return;
        e.preventDefault();
        onRowActivate(it, inPanel);
      });
      check.addEventListener("change", function () {
        it.done = check.checked;
        storageSet(DONE_PREFIX + it.id, it.done ? "1" : null);
        render();
      });

      it.rows.push(row);
      it.checks.push(check);
      it.titles.push(title);
      return row;
    }

    function buildList(extraClass, inPanel) {
      var box = el("div", "appli-nav-list " + extraClass);
      if (inPanel) {
        var count = el("div", "appli-nav-count");
        box.appendChild(count);
        counters.push(count);
      }

      groups.forEach(function (g) {
        if (g.collapsible) {
          var head = el("button", "appli-nav-part");
          head.type = "button";
          head.title = g.part;
          head.addEventListener("click", function () {
            g.open = !g.open;
            g.auto = false;
            render();
          });
          box.appendChild(head);
          g.heads.push(head);
        }
        var body = el("div", "appli-nav-group");
        g.bodies.push(body);
        g.items.forEach(function (it) {
          body.appendChild(buildRow(it, inPanel));
        });
        box.appendChild(body);
      });
      return box;
    }

    // Left rail (shown when there is room left of the text) -------------------
    var sidebar = el("aside");
    sidebar.id = "appli-nav-sidebar";
    sidebar.setAttribute("aria-label", L.applications);
    var railHead = el("div", "appli-nav-head");
    railHead.appendChild(el("span", "appli-nav-prompt", "~/appli $ ls"));
    railCounter = el("span", "appli-nav-counter");
    railHead.appendChild(railCounter);
    sidebar.appendChild(railHead);
    sidebar.appendChild(buildList("appli-nav-side-list", false));
    document.body.appendChild(sidebar);

    // Banner (when the rail does not fit) --------------------------------------
    var banner = el("div", "appli-nav-banner");
    var bannerBtn = el("button", "appli-nav-banner-btn");
    bannerBtn.type = "button";
    bannerBtn.setAttribute("aria-expanded", "false");
    bannerBtn.setAttribute("aria-controls", "appli-nav-panel");
    bannerBtn.setAttribute("aria-label", L.openList);
    var bannerText = el("span", "appli-nav-banner-text");
    var bannerCount = el("span", "appli-nav-banner-count");
    var bannerCaret = el("span", "appli-nav-banner-caret", "▾");
    bannerCaret.setAttribute("aria-hidden", "true");
    bannerBtn.appendChild(bannerText);
    bannerBtn.appendChild(bannerCount);
    bannerBtn.appendChild(bannerCaret);

    var panel = el("div", "appli-nav-panel");
    panel.id = "appli-nav-panel";
    panel.hidden = true;
    panel.appendChild(buildList("appli-nav-panel-list", true));

    banner.appendChild(bannerBtn);
    banner.appendChild(panel);
    document.body.appendChild(banner);

    function setPanel(open) {
      panel.hidden = !open;
      bannerBtn.setAttribute("aria-expanded", open ? "true" : "false");
    }

    bannerBtn.addEventListener("click", function () {
      setPanel(panel.hidden);
    });
    document.addEventListener("click", function (e) {
      if (!panel.hidden && !banner.contains(e.target)) setPanel(false);
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !panel.hidden) {
        setPanel(false);
        bannerBtn.focus();
      }
    });

    // Scrollspy --------------------------------------------------------------
    var frame = null;
    function schedule() {
      if (frame) return;
      frame = window.requestAnimationFrame(function () {
        frame = null;
        measure();
        var next = findCurrent();
        if (next !== current) {
          current = next;
          render();
        }
      });
    }

    window.addEventListener("scroll", schedule, { passive: true });
    window.addEventListener("resize", function () {
      measure();
      schedule();
    });

    if (header) header.addEventListener("transitionend", schedule);

    measure();

    // Lien direct vers une application (#appli-12) : les identifiants n'existaient
    // pas encore quand le navigateur a traité l'ancre.
    var hash = decodeURIComponent(location.hash.slice(1));
    items.forEach(function (it) {
      if (it.id === hash) {
        var y = it.el.getBoundingClientRect().top + window.pageYOffset - scrollOffset();
        window.scrollTo(0, Math.max(0, y));
      }
    });

    current = findCurrent();
    render();
  });
})();
</script>
